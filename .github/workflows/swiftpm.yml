name: SwiftPM

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  Xcode:
    strategy:
      matrix:
        tools: [ {image: xcode-27, xcode: 27.0.0},
                 {image: macos-26, xcode: 26.5} ]
    runs-on: ${{ matrix.tools.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.tools.xcode }}
      - run: xcodebuild -version
      - run: swift -version
      - run: swift test

  Linux:
    strategy:
      matrix:
        tag: ['5.10', '6.0', '6.3', '6.4']
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: swift test --parallel
